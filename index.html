<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      html, body { margin: 0; background: #FFFFFF; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
      .boot-loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #FFFFFF; color: #000000; text-align: center; }
      .boot-loader__content { display: flex; flex-direction: column; align-items: center; }
      .boot-loader__spinner { width: 40px; height: 40px; margin: auto; border: 3px solid rgba(0,0,0,0.08); border-top-color: #000000; border-radius: 50%; animation: boot-spin 0.7s linear infinite; }
      .boot-loader__content strong { display: block; margin-top: 18px; font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
      .boot-loader__content small { display: block; margin-top: 4px; color: rgba(0,0,0,0.4); font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <title>FOOD PACK | Grossiste & Emballages alimentaires au Bénin</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Chargement de FOOD PACK">
        <div class="boot-loader__content">
          <div class="boot-loader__spinner"></div>
          <strong>FOOD PACK.</strong>
          <small>EMBALLAGES ALIMENTAIRES & BOUTEILLES DE JUS</small>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
